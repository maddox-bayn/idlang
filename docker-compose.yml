version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:8080
    depends_on:
      - backend
    networks:
      - idlang-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - TRANSLATOR_URL=http://translator:5005
      - PORT=8080
    depends_on:
      - translator
    networks:
      - idlang-network

  translator:
    build:
      context: ./translator_service
      dockerfile: Dockerfile
    ports:
      - "5005:5005"
    environment:
      - DEVICE=cuda
      - CACHE_DIR=/app/model_cache
      - PORT=5005
    volumes:
      - model_cache:/app/model_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - idlang-network

volumes:
  model_cache:

networks:
  idlang-network:
    driver: bridge
